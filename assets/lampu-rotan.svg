  <ellipse cx="200" cy="152" rx="92" ry="22" fill="#C68B4A" stroke="#8D5524" stroke-width="8"/>
  <path d="M200 70v84M150 79l18 71M250 79l-18 71" stroke="#8D5524" stroke-width="5" opacity=".7"/>

  <!-- bohlam -->
